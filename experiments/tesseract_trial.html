<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesseract.js OCR 실험</title>
<!--
  [1번 담당] OCR 방식 비교 실험 (이슈 #56) — 브라우저에서 Tesseract.js로 채팅 캡처 읽기
  실행 (저장소 맨 위 폴더에서):
    py -m http.server 8000
    → http://localhost:8000/experiments/tesseract_trial.html
  (파일을 더블클릭해서 열면 브라우저 보안 때문에 기본 캡처를 못 불러옴. 그때는 "이미지 선택"으로 고르기)
-->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  body { font-family: "Malgun Gothic", sans-serif; margin: 24px; color: #111; background: #fff; }
  h1 { font-size: 1.3rem; }
  .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  img { max-width: 360px; border: 1px solid #ddd; }
  table { border-collapse: collapse; font-size: .9rem; }
  td, th { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; }
  #status { font-weight: bold; color: #0f766e; }
</style>
</head>
<body>
<h1>Tesseract.js OCR 실험 (kor+eng)</h1>
<p>
  <input type="file" id="file" accept="image/*">
  <label><input type="checkbox" id="pre" checked> 흑백 전처리</label>
  <button id="run">OCR 실행</button>
  <span id="status">대기 중</span>
</p>
<div class="row">
  <img id="preview" src="../docs/images/ocr_sample_chat.png" alt="채팅 캡처">
  <div>
    <h2>처리 시간</h2>
    <table id="timeTable"></table>
    <h2>방법 B: 말풍선 위치로 화자 구분</h2>
    <pre id="chat"></pre>
  </div>
</div>
<h2>OCR 원본 결과 (줄별)</h2>
<table id="lineTable"></table>

<script>
// 지난 EasyOCR 실험(experiments/ocr_trial.py)과 같은 기준값
const HEADER_HEIGHT = 64;    // 맨 위 채팅방 제목 영역은 대화가 아님
const AVATAR_MAX_X = 60;     // 왼쪽 프로필 아이콘 영역
const SAME_BUBBLE_GAP = 20;  // 위아래 줄 간격이 이보다 작으면 같은 말풍선의 다음 줄

// 흑백 전처리: 노란 말풍선 위 글자를 원본 그대로 넣으면 Tesseract가 통째로 놓침
// → 밝기 기준으로 검정/흰색 두 가지로 바꾸고, 프로필 아이콘 영역은 흰색으로 지움
const THRESHOLD = 120;
function preprocess(img) {
  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = pixels.data;
  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = d[i + 1] = d[i + 2] = gray < THRESHOLD ? 0 : 255;
  }
  ctx.putImageData(pixels, 0, 0);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, HEADER_HEIGHT, AVATAR_MAX_X, canvas.height);
  return canvas;
}

function toBubbles(lines, width) {
  const bubbles = [];
  // [수업 적용] 2강 Higher-Order Function — sort()에 비교 함수를 넘겨 위→아래, 왼→오 순서로 정렬
  const sorted = [...lines].sort((a, b) => a.top - b.top || a.left - b.left);
  for (const l of sorted) {
    if (l.top < HEADER_HEIGHT || l.right < AVATAR_MAX_X || !l.text) continue;
    const last = bubbles[bubbles.length - 1];
    if (last && l.top - last.bottom < SAME_BUBBLE_GAP) {
      last.text += " " + l.text;                 // 두 줄로 나뉜 말풍선 이어 붙이기
      last.bottom = Math.max(last.bottom, l.bottom);
      last.left = Math.min(last.left, l.left);
    } else {
      bubbles.push({ text: l.text, bottom: l.bottom, left: l.left });
    }
  }
  // 말풍선 왼쪽 끝이 화면 왼쪽 1/4 안이면 판매자, 아니면 구매자
  bubbles.forEach(b => { b.speaker = b.left < width / 4 ? "판매자" : "구매자"; });
  return bubbles;
}

async function runOcr() {
  const img = document.getElementById("preview");
  const status = document.getElementById("status");
  await img.decode();

  status.textContent = "모델 불러오는 중…";
  const t0 = performance.now();
  const worker = await Tesseract.createWorker("kor+eng");
  await worker.setParameters({ preserve_interword_spaces: "1" });
  const t1 = performance.now();

  status.textContent = "글자 읽는 중…";
  const usePre = document.getElementById("pre").checked;
  const { data } = await worker.recognize(usePre ? preprocess(img) : img);
  const t2 = performance.now();
  await worker.terminate();

  const lines = data.lines.map(l => ({
    text: l.text.trim(), conf: l.confidence,
    left: l.bbox.x0, right: l.bbox.x1, top: l.bbox.y0, bottom: l.bbox.y1,
  }));
  const bubbles = toBubbles(lines, img.naturalWidth);
  const chat = bubbles.map(b => `${b.speaker}: ${b.text}`).join("\n");

  document.getElementById("timeTable").innerHTML =
    `<tr><th>모델 준비 (첫 실행은 언어 데이터 다운로드 포함)</th><td>${((t1 - t0) / 1000).toFixed(1)}초</td></tr>` +
    `<tr><th>글자 인식</th><td>${((t2 - t1) / 1000).toFixed(1)}초</td></tr>`;
  document.getElementById("chat").textContent = chat;
  document.getElementById("lineTable").innerHTML =
    "<tr><th>위치 (x, y)</th><th>신뢰도</th><th>텍스트</th></tr>" +
    lines.map(l => `<tr><td>(${l.left}, ${l.top})</td><td>${(l.conf / 100).toFixed(2)}</td><td>${l.text}</td></tr>`).join("");
  status.textContent = "완료";

  // 결과를 콘솔/자동 측정에서 꺼내 쓸 수 있게 보관
  window.ocrResult = { usePre, prepareSec: (t1 - t0) / 1000, recognizeSec: (t2 - t1) / 1000, lines, chat };
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) document.getElementById("preview").src = URL.createObjectURL(f);
});
// [수업 적용] 2강 First-Class Function — runOcr 함수를 값처럼 이벤트 처리기로 넘김
document.getElementById("run").addEventListener("click", runOcr);
</script>
</body>
</html>
